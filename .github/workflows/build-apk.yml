name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/example/remotearena
          mkdir -p app/src/main
          if [ -f MainActivity.kt ]; then
            mv MainActivity.kt app/src/main/java/com/example/remotearena/
          fi
          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/
          fi
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3"
              id("org.jetbrains.kotlin.android") version "2.0.21"
          }
          android {
              namespace = "com.example.remotearena"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.remotearena"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RemoteArenaKotlin"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteArena-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
